<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PRISMA13 - Rota não Encontrada</title>
    <style>
        :root { --primary: #8A63D2; --bg: #0a0f1d; --card: #1e1e1e; --gold: #FFD700; --anil: #1E88E5; }
        body { 
            background: var(--bg); 
            color: #ffffff; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        #message { 
            background: var(--card); 
            max-width: 450px; 
            padding: 40px; 
            border-radius: 20px; 
            text-align: center; 
            border: 2px solid var(--primary);
            box-shadow: 0 0 30px rgba(138, 99, 210, 0.3);
        }
        h2 { color: var(--gold); font-size: 3rem; margin: 0; }
        h1 { font-size: 1.5rem; margin: 10px 0; color: var(--anil); }
        p { line-height: 1.6; margin: 20px 0; color: #ccc; }
        .btn-retorno { 
            display: inline-block; 
            background: var(--primary); 
            color: white; 
            text-decoration: none; 
            padding: 15px 30px; 
            border-radius: 10px; 
            font-weight: bold; 
            transition: 0.3s;
        }
        .btn-retorno:hover { transform: scale(1.05); filter: brightness(1.2); }
        .footer { margin-top: 30px; font-size: 0.8rem; color: #666; font-style: italic; }
    </style>
</head>
<body>
    <div id="message">
        <h2>404</h2>
        <h1>Sopro e Barro em Desajuste</h1>
        <p>Esta rota não foi localizada na hierarquia do PRISMA13. <br>Indicamos o retorno imediato aos últimos passos <b>aprovados e corretos</b> do seu fluxo evolutivo.</p>
        
        <a href="index.html" class="btn-retorno">RETORNAR AO ALICERCE DO VIGOR</a>
        
        <div class="footer">
            <b>Seeemmpre MelhorrrAndo... NUNKAKABA!</b><br>Há braços!
        </div>
    </div>
  <script src="scripts/footer-selos.js"></script>
</body>
</html>
