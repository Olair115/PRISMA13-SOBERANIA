<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRISMA13 - TELA 02 SOLO e TELA 03 PODER</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: black;
            color: #FFD700;
            font-family: 'Times New Roman', Times, serif;
            overflow-x: hidden;
            position: relative;
        }
        #starsCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        #content {
            position: relative;
            z-index: 10;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            font-size: 2.5em;
            text-shadow: 0 0 20px #FFD700;
            margin-bottom: 20px;
        }
        nav {
            text-align: center;
            margin-bottom: 40px;
        }
        button {
            background: rgba(255, 215, 0, 0.2);
            color: #FFD700;
            border: 1px solid #FFD700;
            padding: 15px 30px;
            margin: 0 10px;
            cursor: pointer;
            font-size: 1.2em;
            font-family: inherit;
            transition: background 0.3s;
        }
        button:hover {
            background: rgba(255, 215, 0, 0.4);
        }
        section {
            display: none;
            background: rgba(0, 0, 0, 0.5);
            padding: 40px;
            min-height: 70vh;
        }
        #solo {
            display: block;
        }
        h2 {
            text-align: center;
            font-size: 2em;
            margin-bottom: 30px;
            text-shadow: 0 0 10px #FFD700;
        }
        h3 {
            font-size: 1.5em;
            margin: 30px 0 20px;
            text-shadow: 0 0 10px #FFD700;
        }
        label {
            display: block;
            margin: 15px 0;
            font-size: 1.1em;
        }
        input, select, textarea {
            background: rgba(0, 0, 0, 0.8);
            color: #FFD700;
            border: 1px solid #FFD700;
            padding: 10px;
            font-size: 1em;
            font-family: inherit;
            width: 100%;
            max-width: 400px;
        }
        input[type="checkbox"], input[type="radio"] {
            width: auto;
            margin-right: 10px;
        }
        textarea {
            resize: vertical;
        }
        .grupo-frases {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        p {
            font-style: italic;
            margin-bottom: 10px;
        }
        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.7);
            z-index: 20;
            font-size: 1.2em;
            font-weight: bold;
        }
        @media (max-width: 768px) {
            .grupo-frases {
                grid-template-columns: 1fr;
            }
            button {
                display: block;
                margin: 10px auto;
            }
        }
    </style>
</head>
<body>
    <canvas id="starsCanvas"></canvas>
    <div id="content">
        <h1>PRISMA13</h1>
        <p style="text-align: center; font-size: 1.3em; font-style: italic;">Elevar potencial beneficia existência eterna.</p>
        <nav>
            <button onclick="showSolo()">TELA 02 - SOLO</button>
            <button onclick="showPoder()">TELA 03 - PODER</button>
        </nav>
        <section id="solo">
            <h2>TELA 02 - SOLO</h2>
            <label>CEP: <input id="cep" type="text" maxlength="9" onchange="saveAll()"></label>
            <label>Localização: <input id="localizacao" type="text" placeholder="Cidade/Estado" onchange="saveAll()"></label>
            <label>Latitude: <input id="lat" type="number" step="any" onchange="saveAll()"></label>
            <label>Longitude: <input id="lng" type="number" step="any" onchange="saveAll()"></label>
            <label>Bioma:
                <select id="bioma" onchange="saveAll()">
                    <option value="Amazônia">Amazônia</option>
                    <option value="Cerrado">Cerrado</option>
                    <option value="Caatinga">Caatinga</option>
                    <option value="Mata Atlântica">Mata Atlântica</option>
                    <option value="Pampa">Pampa</option>
                    <option value="Pantanal">Pantanal</option>
                </select>
            </label>
            <button onclick="getLocation()">Obter Coordenadas GPS</button>
            <button onclick="saveAll()">Salvar SOLO</button>
        </section>
        <section id="poder">
            <h2>TELA 03 - PODER</h2>
            <label>Fase de Validação:
                <select id="fase" onchange="saveAll()">
                    <option value="Vestibular">Vestibular</option>
                    <option value="Neófito">Neófito</option>
                    <option value="Discípulo">Discípulo</option>
                    <option value="Mestre">Mestre</option>
                </select>
            </label>
            <label>Geração (3):
                <select id="geracao" onchange="saveAll()">
                    <option value="Ancestral">Ancestral</option>
                    <option value="Parental">Parental</option>
                    <option value="Atual">Atual</option>
                </select>
            </label>
            <label>Ramo (4):
                <select id="ramo" onchange="saveAll()">
                    <option value="Paterno">Paterno</option>
                    <option value="Materno">Materno</option>
                    <option value="Espiritual">Espiritual</option>
                    <option value="Cosmológico">Cosmológico</option>
                </select>
            </label>
            <label>Aspecto (4):
                <select id="aspecto" onchange="saveAll()">
                    <option value="Físico">Físico</option>
                    <option value="Mental">Mental</option>
                    <option value="Emocional">Emocional</option>
                    <option value="Espiritual">Espiritual</option>
                </select>
            </label>
            <label>Herança (4):
                <select id="heranca" onchange="saveAll()">
                    <option value="Genética">Genética</option>
                    <option value="Cultural">Cultural</option>
                    <option value="Kármica">Kármica</option>
                    <option value="Estelar">Estelar</option>
                </select>
            </label>
            <h3>13 Dimensões (UX/Métrica/Referencial Filosófico)</h3>
            <div id="dimensoes"></div>
            <label>Escore d'Alma (1-14):
                <select id="escore" onchange="saveAll()">
                    <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>
                    <option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option>
                    <option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option>
                    <option value="13">13</option><option value="14">14</option>
                </select>
            </label>
            <h3>12 Frases Assertivas Pareadas 2×2</h3>
            <div id="frases"></div>
            <button onclick="saveAll()">Salvar PODER</button>
        </section>
    </div>
    <footer>Seeemmpre MelhorrrAndo... NUNKAKABA! Há braços!</footer>
    <script>
        // Stars animation
        const canvas = document.getElementById('starsCanvas');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        for (let i = 0; i < 500; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 1.5 + 0.5,
                phase: Math.random() * Math.PI * 2,
                driftX: (Math.random() - 0.5) * 0.2,
                driftY: (Math.random() - 0.5) * 0.2
            });
        }

        function animateStars() {
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            for (let star of stars) {
                star.phase += 0.08;
                const alpha = Math.sin(star.phase) * 0.5 + 0.5;
                star.x += star.driftX;
                star.y += star.driftY;
                if (star.x < 0) star.x = canvas.width;
                if (star.x > canvas.width) star.x = 0;
                if (star.y < 0) star.y = canvas.height;
                if (star.y > canvas.height) star.y = 0;

                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
            requestAnimationFrame(animateStars);
        }
        animateStars();

        // Data structures
        const dimensions = [
            {id:1, name:"Autenticidade", ref:"Heidegger", ux:"Ser-no-mundo autêntico"},
            {id:2, name:"Liberdade", ref:"Sartre", ux:"Escolha responsável existencial"},
            {id:3, name:"Prudência", ref:"Aristóteles", ux:"Discernimento virtuoso prático"},
            {id:4, name:"Coragem", ref:"Aristóteles", ux:"Ação temerária nobre"},
            {id:5, name:"Temperança", ref:"Aristóteles", ux:"Moderação desejos equilibrada"},
            {id:6, name:"Justiça", ref:"Platão", ux:"Harmonia alma societal"},
            {id:7, name:"Sabedoria", ref:"Platão", ux:"Conhecimento formas ideais"},
            {id:8, name:"Conatus", ref:"Spinoza", ux:"Esforço perseverar existência"},
            {id:9, name:"Alegria", ref:"Spinoza", ux:"Transição afetiva positiva"},
            {id:10, name:"Razão", ref:"Spinoza", ux:"Compreensão adequada causas"},
            {id:11, name:"Angústia", ref:"Heidegger", ux:"Revelação finitude ser"},
            {id:12, name:"Má-Fé", ref:"Sartre", ux:"Autoengano liberdade negada"},
            {id:13, name:"Bem Supremo", ref:"Platão", ux:"Luz eterna guia formas"}
        ];

        const frasesAssertivas = [
            "Expandir consciência desperta potencial infinito.",
            "Fortalecer corpo eleva energia vital.",
            "Cultivar sabedoria guia decisões sábias.",
            "Praticar gratidão multiplica alegrias diárias.",
            "Dominar emoções equilibra mente serena.",
            "Conectar almas forja laços eternos.",
            "Persistir metas realiza sonhos grandiosos.",
            "Aprender sempre enriquece existência plena.",
            "Meditar diariamente clareia visão interior.",
            "Agir eticamente atrai prosperidade verdadeira.",
            "Criar beleza inspira mundo ao redor.",
            "Amar incondicionalmente cura feridas profundas."
        ];

        // Functions
        function showSolo() {
            document.getElementById('solo').style.display = 'block';
            document.getElementById('poder').style.display = 'none';
        }

        function showPoder() {
            document.getElementById('solo').style.display = 'none';
            document.getElementById('poder').style.display = 'block';
        }

        function populateDims() {
            let html = '';
            dimensions.forEach((d, i) => {
                const id = 'dim' + d.id;
                html += `<label><input type="checkbox" id="${id}" onchange="saveAll()"> ${d.name} (${d.ref}) - ${d.ux}</label>`;
            });
            document.getElementById('dimensoes').innerHTML = html;
        }

        function populateFrases() {
            let html = '';
            for (let i = 0; i < frasesAssertivas.length; i += 4) {
                html += '<div class="grupo-frases">';
                for (let j = 0; j < 4 && i + j < frasesAssertivas.length; j++) {
                    const num = i + j + 1;
                    const frase = frasesAssertivas[i + j];
                    html += `
                        <div>
                            <p>${num}. ${frase}</p>
                            <label><input type="radio" name="frase${num}" value="accept" onchange="saveAll()"> Aceitar</label>
                            <label><input type="radio" name="frase${num}" value="reject" onchange="saveAll()"> Rejeitar</label>
                            <br><label>Justificativa: <textarea id="justif${num}" onchange="saveAll()" rows="3"></textarea></label>
                        </div>`;
                }
                html += '</div>';
            }
            document.getElementById('frases').innerHTML = html;
        }

        function saveAll() {
            const data = {
                solo: {
                    cep: document.getElementById('cep').value,
                    localizacao: document.getElementById('localizacao').value,
                    lat: document.getElementById('lat').value,
                    lng: document.getElementById('lng').value,
                    bioma: document.getElementById('bioma').value
                },
                poder: {
                    fase: document.getElementById('fase').value,
                    geracao: document.getElementById('geracao').value,
                    ramo: document.getElementById('ramo').value,
                    aspecto: document.getElementById('aspecto').value,
                    heranca: document.getElementById('heranca').value,
                    escore: document.getElementById('escore').value,
                    dims: {},
                    frases: []
                }
            };

            // Dims
            dimensions.forEach(d => {
                const id = 'dim' + d.id;
                data.poder.dims[d.id] = document.getElementById(id)?.checked || false;
            });

            // Frases
            for (let i = 0; i < 12; i++) {
                const num = i + 1;
                const acceptEl = document.querySelector(`input[name="frase${num}"][value="accept"]:checked`);
                const rejectEl = document.querySelector(`input[name="frase${num}"][value="reject"]:checked`);
                const accept = !!acceptEl;
                const justif = document.getElementById('justif' + num)?.value || '';
                data.poder.frases.push({accept, justif});
            }

            localStorage.setItem('prisma13', JSON.stringify(data));
        }

        function loadData() {
            const dataStr = localStorage.getItem('prisma13');
            if (!dataStr) return;
            const data = JSON.parse(dataStr);

            // Solo
            if (data.solo) {
                document.getElementById('cep').value = data.solo.cep || '';
                document.getElementById('localizacao').value = data.solo.localizacao || '';
                document.getElementById('lat').value = data.solo.lat || '';
                document.getElementById('lng').value = data.solo.lng || '';
                document.getElementById('bioma').value = data.solo.bioma || 'Amazônia';
            }

            // Poder
            if (data.poder) {
                document.getElementById('fase').value = data.poder.fase || 'Vestibular';
                document.getElementById('geracao').value = data.poder.geracao || 'Ancestral';
                document.getElementById('ramo').value = data.poder.ramo || 'Paterno';
                document.getElementById('aspecto').value = data.poder.aspecto || 'Físico';
                document.getElementById('heranca').value = data.poder.heranca || 'Genética';
                document.getElementById('escore').value = data.poder.escore || '1';

                // Dims
                if (data.poder.dims) {
                    dimensions.forEach(d => {
                        const id = 'dim' + d.id;
                        const el = document.getElementById(id);
                        if (el) el.checked = data.poder.dims[d.id] || false;
                    });
                }

                // Frases
                if (data.poder.frases) {
                    data.poder.frases.forEach((f, i) => {
                        const num = i + 1;
                        if (f.accept) {
                            const acceptEl = document.querySelector(`input[name="frase${num}"][value="accept"]`);
                            if (acceptEl) acceptEl.checked = true;
                        } else {
                            const rejectEl = document.querySelector(`input[name="frase${num}"][value="reject"]`);
                            if (rejectEl) rejectEl.checked = true;
                        }
                        const justifEl = document.getElementById('justif' + num);
                        if (justifEl) justifEl.value = f.justif || '';
                    });
                }
            }
        }

        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    document.getElementById('lat').value = pos.coords.latitude;
                    document.getElementById('lng').value = pos.coords.longitude;
                    saveAll();
                }, (err) => {
                    alert('Erro ao obter localização: ' + err.message);
                });
            } else {
                alert('Geolocalização não suportada.');
            }
        }

        // Init
        window.addEventListener('load', () => {
            populateDims();
            populateFrases();
            loadData();
        });
    </script>
</body>
</html>
