<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRISMAS - Espiritualidade ARES</title>
    <style>
        :root { --primary: #6c5ce7; --bg: #000; --gold: #ffd700; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; text-align: center; }
        .container { max-width: 650px; width: 100%; }
        h1 { font-size: 2.5rem; letter-spacing: 8px; text-transform: uppercase; margin-bottom: 5px; font-weight: 800; }
        .subtitulo { font-size: 0.9rem; font-style: italic; color: var(--primary); text-decoration: underline; margin-bottom: 40px; display: block; }
        
        /* A ESCALA ARES NO PRISMA */
        .escala-box { text-align: left; background: rgba(108, 92, 231, 0.05); border-left: 3px solid var(--primary); padding: 30px; margin-bottom: 40px; }
        .pergunta-ares { font-size: 1.1rem; line-height: 1.6; margin-bottom: 20px; color: #eee; }
        .opcoes-ares { display: flex; justify-content: space-between; margin-top: 10px; }
        .btn-check { background: #111; border: 1px solid #333; color: #888; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; transition: 0.3s; }
        .btn-check:hover { border-color: var(--gold); color: var(--gold); }

        .btn-evolucao { background: transparent; color: var(--gold); border: none; padding: 25px; cursor: pointer; width: 100%; font-family: 'Times New Roman', Times, serif; font-size: 1.7rem; font-weight: bold; }
        .footer-padrao { margin-top: 60px; padding-top: 30px; border-top: 1px solid #222; }
        .lema { font-size: 0.9rem; letter-spacing: 1.5px; color: #888; }
        .lema b { color: var(--primary); text-transform: uppercase; }
        .saudacao { display: block; margin-top: 10px; font-weight: 700; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>ESPIRITUALIDADE</h1>
        <span class="subtitulo">Escala ARES: Atitudes e Transcendência</span>
        
        <div class="escala-box">
            <div class="pergunta-ares">
                <b>Atitude 01:</b> "Eu acredito em algo sagrado, transcendente (Deus, uma força superior)."
            </div>
            <div class="opcoes-ares">
                <button class="btn-check">Discordo</button>
                <button class="btn-check">Neutro</button>
                <button class="btn-check">Concordo</button>
            </div>
        </div>

        <button class="btn-evolucao" onclick="window.location.href='/tela14/index.html'">
            Sincronizar Vigor
        </button>
        
        <footer class="footer-padrao">
            <p class="lema"><i>Seeemmpre MelhorrrAndo...</i> <b>NUNKAKABA!</b><span class="saudacao">Há braços!</span></p>
        </footer>
    </div>
  <script src="../scripts/footer-selos.js"></script>
</body>
</html>
