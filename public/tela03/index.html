<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela 03-05: Genealogia, Dimensões e Frases Assertivas</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: black;
            color: #FFD700;
            font-family: 'Cinzel', serif;
            overflow-x: hidden;
        }

        #stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        #content {
            position: relative;
            z-index: 1;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        nav {
            text-align: center;
            margin-bottom: 30px;
        }

        button {
            background: transparent;
            color: #FFD700;
            border: 2px solid #FFD700;
            padding: 15px 30px;
            font-size: 18px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 5px;
            margin: 0 10px;
        }

        button:hover {
            background: #FFD700;
            color: black;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        h1 { font-size: 2.5em; text-align: center; text-shadow: 0 0 20px #FFD700; margin-bottom: 30px; }
        h2 { font-size: 1.8em; margin: 20px 0 10px 0; text-shadow: 0 0 10px #FFD700; }
        h3 { font-size: 1.4em; margin: 15px 0 10px 30px; }
        h4 { font-size: 1.2em; margin: 10px 0 5px 50px; }

        #tela03 > div { margin-bottom: 40px; }
        #tela03 div div { margin-left: 20px; }
        #tela03 label { display: block; margin: 5px 0 5px 60px; cursor: pointer; }

        #tela04 > div { margin-bottom: 40px; padding: 20px; background: rgba(255,215,0,0.05); border-radius: 10px; }
        #tela04 .philos { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
        #tela04 label { display: inline-block; margin: 5px; cursor: pointer; }
        #tela04 input[type="range"] { width: 200px; margin: 0 10px; accent-color: #FFD700; }

        .phrases {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .phrase {
            padding: 20px;
            background: rgba(255,215,0,0.08);
            border-radius: 10px;
            transition: background 0.3s;
        }

        .phrase:hover {
            background: rgba(255,215,0,0.15);
        }

        .phrase p { font-style: italic; margin-bottom: 15px; font-size: 1.1em; }
        .phrase label { display: block; margin: 10px 0; cursor: pointer; }
        .phrase textarea {
            width: 100%;
            height: 80px;
            background: transparent;
            color: #FFD700;
            border: 1px solid #FFD700;
            border-radius: 5px;
            padding: 10px;
            font-family: inherit;
            resize: vertical;
        }

        input[type="checkbox"], input[type="radio"] {
            accent-color: #FFD700;
            transform: scale(1.3);
            margin-right: 8px;
        }

        input[type="range"] {
            accent-color: #FFD700;
        }

        #resumo, #nivel {
            margin-top: 20px;
            padding: 20px;
            background: rgba(255,215,0,0.1);
            border-radius: 10px;
            font-size: 1.2em;
        }

        #final {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.95);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 100;
            text-align: center;
        }

        #final h1 {
            font-size: 4em;
            text-shadow: 0 0 30px #FFD700;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 20px #FFD700; }
            to { text-shadow: 0 0 40px #FFD700, 0 0 60px #FFD700; }
        }

        @media (max-width: 768px) {
            #content { padding: 10px; }
            h1 { font-size: 2em; }
            .phrases { grid-template-columns: 1fr; }
            button { padding: 10px 20px; font-size: 16px; }
            #tela03 label { margin-left: 20px; font-size: 0.9em; }
        }
    </style>
</head>
<body>
    <canvas id="stars"></canvas>
    <div id="content">
        <nav>
            <button id="prev">Voltar</button>
            <button id="next">Próxima</button>
        </nav>
        <section id="tela03"></section>
        <section id="tela04"></section>
        <section id="tela05"></section>
    </div>
    <div id="final">
        <h1>Seeemmpre MelhorrrAndo... NUNKAKABA! Há braços!</h1>
    </div>

    <script>
        // Data arrays
        const geracoes = ['Ancestral', 'Parental', 'Atual'];
        const ramos = ['Paterno', 'Materno', 'Espiritual', 'Cosmológico'];
        const aspectos = ['Físico', 'Mental', 'Emocional', 'Espiritual'];
        const herancas = ['Genética', 'Cultural', 'Kármica', 'Estelar'];
        const dims = ['AR LIMPO', 'ÁGUA VIVA', 'LUZ SOLAR', 'SONO', 'MOVIMENTO', 'NUTRIÇÃO', 'JEJUM', 'PENSAMENTO', 'SENTIMENTO', 'AÇÕES', 'TRABALHO', 'ESPÍRITO', 'SOBERANIA'];
        const philos = ['Heidegger', 'Sartre', 'Aristóteles', 'Platão', 'Spinoza'];
        const phrases = [
            "Respirar profundamente pela manhã traz serenidade e ativa nervo vago.",
            "Beber água viva em jejum hidrata células e purifica sistema linfático.",
            "Absorver luz solar ao nascer regula circadianos e eleva vitamina D.",
            "Dormir profundamente 8 horas restaura telômeros e consolida aprendizado.",
            "Mover corpo diariamente fortalece coração e libera dopamina natural.",
            "Nutrir-se alimentos integrais nutre mitocôndrias e equilibra microbioma.",
            "Jejuar intermitentemente regenera autófago e clarifica sinapses neurais.",
            "Pensar afirmativamente reprograma subconsciente e atrai sincronicidades.",
            "Sentir gratidão expandida abre chakras cardíaco e multiplica abundância.",
            "Agir intencionalmente constrói momentum e realiza potencial quântico.",
            "Trabalhar criativamente manifesta fluxo e alinha propósito universal.",
            "Conectar espírito superior eleva vibração e dissolve dualidades ilusórias."
        ];

        // Stars
        const canvas = document.getElementById('stars');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function initStars() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            stars = [];
            for (let i = 0; i < 500; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: Math.random() * 1 + 0.5,
                    opacity: Math.random() * 0.7 + 0.3,
                    dOpacity: (Math.random() * 0.02 + 0.005) * (Math.random() > 0.5 ? 1 : -1)
                });
            }
        }

        function animateStars() {
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            stars.forEach(s => {
                s.opacity += s.dOpacity;
                if (s.opacity >= 1 || s.opacity <= 0.3) s.dOpacity *= -1;
                ctx.save();
                ctx.globalAlpha = s.opacity;
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
            requestAnimationFrame(animateStars);
        }

        // Telas
        const telas = ['tela03', 'tela04', 'tela05'];
        let currentIdx = 0;

        function showTela() {
            telas.forEach((t, i) => {
                document.getElementById(t).style.display = i === currentIdx ? 'block' : 'none';
            });
            document.getElementById('prev').disabled = currentIdx === 0;
            document.getElementById('next').disabled = false;
        }

        function generateTela03() {
            const container = document.getElementById('tela03');
            container.innerHTML = '<h1>TELA 03: Genealogia (HF - História Familiar)</h1>';
            geracoes.forEach((g, i) => {
                const gdiv = document.createElement('div');
                gdiv.innerHTML = `<h2>${g}</h2>`;
                ramos.forEach((r, j) => {
                    const rdiv = document.createElement('div');
                    rdiv.innerHTML = `<h3>${r}</h3>`;
                    aspectos.forEach((a, k) => {
                        const adiv = document.createElement('div');
                        adiv.innerHTML = `<h4>${a}</h4>`;
                        herancas.forEach((h, l) => {
                            const id = `t03_${i}_${j}_${k}_${l}`;
                            const label = document.createElement('label');
                            label.innerHTML = `<input type="checkbox" id="${id}"> ${h}`;
                            adiv.appendChild(label);
                        });
                        rdiv.appendChild(adiv);
                    });
                    gdiv.appendChild(rdiv);
                });
                container.appendChild(gdiv);
            });
        }

        function generateTela04() {
            const container = document.getElementById('tela04');
            container.innerHTML = '<h1>TELA 04: 13 Dimensões + Referenciais</h1>';
            dims.forEach((d, i) => {
                const ddiv = document.createElement('div');
                ddiv.innerHTML = `<h2>${d}</h2>`;
                const pdiv = document.createElement('div');
                pdiv.className = 'philos';
                philos.forEach((p, j) => {
                    const id = `t04_${i}_p_${j}`;
                    const label = document.createElement('label');
                    label.innerHTML = `<input type="checkbox" id="${id}"> ${p}`;
                    pdiv.appendChild(label);
                });
                ddiv.appendChild(pdiv);
                const slidiv = document.createElement('div');
                const mid = `t04_${i}_metric`;
                const mval = `${mid}_val`;
                slidiv.innerHTML = `<label>UX/Métrica: <input type="range" id="${mid}" min="0" max="10" value="5"> <span id="${mval}">5</span></label>`;
                ddiv.appendChild(slidiv);
                container.appendChild(ddiv);
            });
            container.innerHTML += '<button id="level-btn">Validar Nível</button><div id="nivel"></div>';
        }

        function generateTela05() {
            const container = document.getElementById('tela05');
            container.innerHTML = '<h1>TELA 05: 12 Frases Assertivas (Pareadas 2×2)</h1>';
            const grid = document.createElement('div');
            grid.className = 'phrases';
            phrases.forEach((ph, i) => {
                const pdiv = document.createElement('div');
                pdiv.className = 'phrase';
                pdiv.innerHTML = `
                    <p>${ph}</p>
                    <label><input type="radio" name="p${i}_status" value="accept"> Aceitar</label>
                    <label><input type="radio" name="p${i}_status" value="reject"> Rejeitar</label>
                    <label><input type="radio" name="p${i}_status" value=""> Nenhum</label>
                    <textarea name="p${i}_just" placeholder="Justificativa (opcional)"></textarea>
                `;
                grid.appendChild(pdiv);
            });
            container.appendChild(grid);
            container.innerHTML += `
                <div style="text-align:center; margin:30px 0;">
                    <label>Escore d\'Alma: <input type="range" id="alma_score" min="1" max="14" value="7"> <span id="alma_val">7</span></label>
                </div>
                <button id="resumo-btn">Gerar Resumo Final</button>
                <div id="resumo"></div>
            `;
        }

        function setupSliders() {
            document.querySelectorAll('input[type="range"]').forEach(slider => {
                const valSpan = document.getElementById(slider.id + '_val');
                if (valSpan) {
                    slider.oninput = () => {
                        valSpan.textContent = slider.value;
                    };
                }
            });
        }

        function setupEvents() {
            document.getElementById('resumo-btn').onclick = updateResumo;
            document.getElementById('level-btn').onclick = computeLevel;
        }

        function saveTela03() {
            const data = [];
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 4; j++) {
                    for (let k = 0; k < 4; k++) {
                        for (let l = 0; l < 4; l++) {
                            data.push(document.getElementById(`t03_${i}_${j}_${k}_${l}`).checked);
                        }
                    }
                }
            }
            localStorage.setItem('tela03', JSON.stringify(data));
        }

        function saveTela04() {
            const philosData = [];
            for (let i = 0; i < 13; i++) {
                for (let j = 0; j < 5; j++) {
                    philosData.push(document.getElementById(`t04_${i}_p_${j}`).checked);
                }
            }
            const metricsData = [];
            for (let i = 0; i < 13; i++) {
                metricsData.push(document.getElementById(`t04_${i}_metric`).value);
            }
            localStorage.setItem('tela04_philos', JSON.stringify(philosData));
            localStorage.setItem('tela04_metrics', JSON.stringify(metricsData));
        }

        function saveTela05() {
            const status = [], justif = [];
            for (let i = 0; i < 12; i++) {
                const checked = document.querySelector(`input[name="p${i}_status"]:checked`);
                status[i] = checked ? checked.value : '';
                justif[i] = document.querySelector(`textarea[name="p${i}_just"]`).value;
            }
            localStorage.setItem('tela05_status', JSON.stringify(status));
            localStorage.setItem('tela05_just', JSON.stringify(justif));
            localStorage.setItem('tela05_alma', document.getElementById('alma_score').value);
        }

        function saveAll() {
            saveTela03();
            saveTela04();
            saveTela05();
        }

        function loadTela03() {
            const data = JSON.parse(localStorage.getItem('tela03') || '[]');
            let idx = 0;
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 4; j++) {
                    for (let k = 0; k < 4; k++) {
                        for (let l = 0; l < 4; l++) {
                            document.getElementById(`t03_${i}_${j}_${k}_${l}`).checked = data[idx++] || false;
                        }
                    }
                }
            }
        }

        function loadTela04() {
            const philosData = JSON.parse(localStorage.getItem('tela04_philos') || '[]');
            let idx = 0;
            for (let i = 0; i < 13; i++) {
                for (let j = 0; j < 5; j++) {
                    document.getElementById(`t04_${i}_p_${j}`).checked = philosData[idx++] || false;
                }
            }
            const metricsData = JSON.parse(localStorage.getItem('tela04_metrics') || '[]');
            for (let i = 0; i < 13; i++) {
                if (metricsData[i]) {
                    const slider = document.getElementById(`t04_${i}_metric`);
                    slider.value = metricsData[i];
                    document.getElementById(`${slider.id}_val`).textContent = metricsData[i];
                }
            }
        }

        function loadTela05() {
            const status = JSON.parse(localStorage.getItem('tela05_status') || '[]');
            const justif = JSON.parse(localStorage.getItem('tela05_just') || '[]');
            for (let i = 0; i < 12; i++) {
                if (status[i]) {
                    document.querySelector(`input[name="p${i}_status"][value="${status[i]}"]`).checked = true;
                }
                document.querySelector(`textarea[name="p${i}_just"]`).value = justif[i] || '';
            }
            const alma = localStorage.getItem('tela05_alma') || '7';
            document.getElementById('alma_score').value = alma;
            document.getElementById('alma_val').textContent = alma;
        }

        function loadState() {
            loadTela03();
            loadTela04();
            loadTela05();
        }

        function computeLevel() {
            let philosChecked = 0;
            for (let i = 0; i < 13; i++) {
                for (let j = 0; j < 5; j++) {
                    if (document.getElementById(`t04_${i}_p_${j}`).checked) philosChecked++;
                }
            }
            let metricsSum = 0;
            for (let i = 0; i < 13; i++) {
                metricsSum += parseFloat(document.getElementById(`t04_${i}_metric`).value);
            }
            const avgMetric = metricsSum / 13;
            const score = ((philosChecked / 65) * 10 + avgMetric) / 2;
            let level;
            if (score < 3) level = 'Vestibular';
            else if (score < 6) level = 'Neófito';
            else if (score < 8) level = 'Discípulo';
            else level = 'Mestre';
            document.getElementById('nivel').innerHTML = `<strong>Nível: ${level}</strong> (Pontos: ${score.toFixed(1)})`;
        }

        function updateResumo() {
            let accepts = 0, rejects = 0, totalJust = 0;
            for (let i = 0; i < 12; i++) {
                const checked = document.querySelector(`input[name="p${i}_status"]:checked`);
                if (checked) {
                    if (checked.value === 'accept') accepts++;
                    else if (checked.value === 'reject') rejects++;
                }
                totalJust += document.querySelector(`textarea[name="p${i}_just"]`).value.length;
            }
            const alma = document.getElementById('alma_score').value;
            document.getElementById('resumo').innerHTML = `
                <p><strong>Aceitas:</strong> ${accepts}/12</p>
                <p><strong>Rejeitadas:</strong> ${rejects}/12</p>
                <p><strong>Justificativas (chars):</strong> ${totalJust}</p>
                <p><strong>Escore d\'Alma:</strong> ${alma}/14</p>
            `;
        }

        function showFinal() {
            document.getElementById('content').style.display = 'none';
            document.getElementById('final').style.display = 'flex';
            setTimeout(() => {
                window.location.href = '/';
            }, 5000);
        }

        // Navigation
        document.getElementById('prev').onclick = () => {
            if (currentIdx > 0) {
                currentIdx--;
                showTela();
                saveAll();
            }
        };

        document.getElementById('next').onclick = () => {
            if (currentIdx < 2) {
                currentIdx++;
                showTela();
                saveAll();
            } else {
                saveAll();
                showFinal();
            }
        };

        // Init
        window.addEventListener('resize', initStars);
        window.addEventListener('beforeunload', saveAll);

        window.onload = () => {
            initStars();
            animateStars();
            generateTela03();
            generateTela04();
            generateTela05();
            setupSliders();
            setupEvents();
            loadState();
            showTela();
        };
    </script>
</body>
</html>
