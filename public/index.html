<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PRISMA13 — a imPRECISÃO da Vida.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root { --preto: #000000; --ouro: #ffd700; --ouro-vivo: #fff2a8; --primary: #6c5ce7; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100%; background: #000; overflow: hidden; color: var(--ouro) !important; font-family: "Montserrat", sans-serif; }
    
    #kosmos { position: fixed; inset: 0; z-index: 0; display: block; background: #000; }
    
    .tela01 { position: relative; z-index: 2; width: 100%; min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; align-items: center; justify-items: center; padding: 20px; }
    
    .marca { font-size: clamp(3rem, 8vw, 6rem); font-weight: 900; letter-spacing: 5px; text-transform: uppercase; text-shadow: 0 0 15px var(--ouro); text-align: center; }
    .subtitulo { font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 700; font-size: 1.4rem; margin-top: 10px; text-align: center; }

    .mandala-wrap { width: min(600px, 70vmin); aspect-ratio: 1 / 1; display: grid; place-items: center; }
    .mandala-svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.2)); }
    
    .slogan-solo { font-family: "Cormorant Garamond", serif; font-size: 1.35rem; font-weight: 700; font-style: italic; margin: 20px 0; line-height: 1.4; text-align: left; width: 100%; max-width: 450px; }
    
    .entrada { width: 100%; max-width: 400px; display: grid; gap: 15px; margin-top: 10px; }
    input { background: transparent; border: 0; border-bottom: 1px solid var(--ouro); color: var(--ouro) !important; padding: 10px; text-align: left; font-size: 1.1rem; outline: none; }
    input::placeholder { color: rgba(255, 215, 0, 0.4); }

    .footer-prisma { width: 100%; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 20px; padding: 20px; border-top: 1px solid rgba(255,215,0,0.1); }
    .lema-ouro { font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 1rem; text-align: center; color: var(--ouro) !important; }
  </style>
</head>
<body>
  <canvas id="kosmos"></canvas>
  <main class="tela01">
    <header>
      <h1 class="marca">PRISMA13</h1>
      <p class="subtitulo">a imPRECISÃO da Vida.</p>
    </header>

    <section class="mandala-wrap">
       <svg id="mandala" class="mandala-svg" viewBox="0 0 760 760"></svg>
    </section>

    <div class="entrada">
      <div class="slogan-solo">
        O solo, fértil, garante a sobrevivência.<br>
        A cultura, autônoma, garante a melhoria.
      </div>
      <input id="login" type="text" placeholder="IDENTIFICAÇÃO">
      <input id="senha" type="password" placeholder="SENHA (13)">
      <div id="status" style="font-size: 0.8rem; height: 1.2rem;"></div>
    </div>

    <footer class="footer-prisma">
      <div style="text-align:right">SOL</div>
      <div class="lema-ouro">
        Seeemmpre melhorrrAndo... <b>NUNKAKABA!</b><br>
        Há braços! | Dr. Olair Rafael
      </div>
      <div style="text-align:left">IMC22</div>
    </footer>
  </main>

  <script>
    // Iniciar Kosmos (Fundo Estelar)
    const c = document.getElementById('kosmos');
    const ctx = c.getContext('2d');
    let w, h, stars = [];
    function resize() { w = c.width = innerWidth; h = c.height = innerHeight; }
    window.onresize = resize; resize();
    for(let i=0; i<200; i++) stars.push({x:Math.random()*w, y:Math.random()*h, r:Math.random()*1.5});
    function draw() {
      ctx.clearRect(0,0,w,h); ctx.fillStyle="#fff";
      stars.forEach(s => { ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill(); });
      requestAnimationFrame(draw);
    }
    draw();

    // Lógica de Travessia Automática
    const login = document.getElementById('login');
    const senha = document.getElementById('senha');
    const status = document.getElementById('status');
    
    function validar() {
      if (login.value.length >= 2 && senha.value === '13') {
        status.textContent = "Entrada reconhecida. Travessia iniciada.";
        localStorage.setItem('prisma_login', login.value);
        setTimeout(() => { window.location.href = "tela02/index.html"; }, 500);
      }
    }
    login.oninput = validar; senha.oninput = validar;
  </script>
</body>
</html>
