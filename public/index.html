
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PRISMA13 · Portal</title>

  <style>
    :root{
      --bg:#000;
      --fg:#fff;
      --muted:rgba(255,255,255,.58);
      --soft:rgba(255,255,255,.28);
      --gold:#ffe600;
      --gold2:#ffb800;
      --cyan:#7ffcff;
      --green:#7cffb2;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html,body{
      width:100%;
      min-height:100%;
      background:#000;
      color:#fff;
      font-family:Arial, Helvetica, sans-serif;
      overflow:hidden;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      z-index:0;
      pointer-events:none;
      background:
        radial-gradient(circle at 8% 18%, rgba(255,255,255,.82) 0 1px, transparent 2px),
        radial-gradient(circle at 17% 70%, rgba(255,230,0,.65) 0 1px, transparent 2px),
        radial-gradient(circle at 31% 29%, rgba(255,255,255,.48) 0 1px, transparent 2px),
        radial-gradient(circle at 44% 78%, rgba(255,255,255,.58) 0 1px, transparent 2px),
        radial-gradient(circle at 56% 12%, rgba(255,230,0,.48) 0 1px, transparent 2px),
        radial-gradient(circle at 70% 68%, rgba(255,255,255,.52) 0 1px, transparent 2px),
        radial-gradient(circle at 82% 26%, rgba(255,230,0,.48) 0 1px, transparent 2px),
        radial-gradient(circle at 94% 76%, rgba(255,255,255,.62) 0 1px, transparent 2px),
        radial-gradient(circle at 50% 50%, rgba(255,230,0,.045), transparent 58%);
      background-size:
        280px 280px,
        340px 340px,
        300px 300px,
        360px 360px,
        290px 290px,
        330px 330px,
        280px 280px,
        360px 360px,
        100% 100%;
      opacity:.58;
      animation:twinkle 6s ease-in-out infinite alternate;
    }

    body::after{
      content:"";
      position:fixed;
      left:-44vw;
      top:16vh;
      width:38vw;
      height:2px;
      background:linear-gradient(90deg, transparent, rgba(255,255,255,.25), var(--gold), transparent);
      transform:rotate(-18deg);
      opacity:0;
      filter:drop-shadow(0 0 12px rgba(255,230,0,.9));
      animation:estrelaCadente 14s linear infinite;
      pointer-events:none;
      z-index:0;
    }

    @keyframes twinkle{
      from{opacity:.34}
      to{opacity:.78}
    }

    @keyframes estrelaCadente{
      0%,66%{opacity:0; transform:translate(-8vw,-10vh) rotate(-18deg);}
      72%{opacity:.95;}
      88%{opacity:0; transform:translate(150vw,74vh) rotate(-18deg);}
      100%{opacity:0;}
    }

    .page{
      position:relative;
      z-index:1;
      width:min(1160px, calc(100% - 34px));
      min-height:100vh;
      margin:0 auto;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:34px 0 76px;
    }

    .portal{
      width:min(760px, 100%);
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
    }

    .eyebrow{
      font-size:10px;
      font-weight:900;
      letter-spacing:.34em;
      text-transform:uppercase;
      color:rgba(255,255,255,.42);
      margin-bottom:16px;
    }

    h1{
      font-size:clamp(58px, 9vw, 118px);
      line-height:.86;
      font-weight:900;
      letter-spacing:.15em;
      text-transform:uppercase;
      margin-bottom:18px;
    }

    .sub{
      font-family:Georgia, "Times New Roman", serif;
      font-style:italic;
      font-size:clamp(18px, 2vw, 25px);
      line-height:1.42;
      color:rgba(255,255,255,.78);
      margin-bottom:32px;
    }

    .teia{
      width:min(430px, 84vw);
      height:min(430px, 84vw);
      margin:0 auto 28px;
      display:grid;
      place-items:center;
      position:relative;
    }

    svg{
      width:100%;
      height:100%;
      overflow:visible;
      display:block;
    }

    .label{
      fill:rgba(255,255,255,.62);
      font-size:8.2px;
      font-weight:900;
      letter-spacing:.12em;
      text-transform:uppercase;
      dominant-baseline:middle;
      text-anchor:middle;
      filter:drop-shadow(0 0 6px rgba(0,0,0,.9));
    }

    .grade{
      fill:none;
      stroke:rgba(255,255,255,.11);
      stroke-width:1;
    }

    .raio{
      stroke:rgba(255,255,255,.17);
      stroke-width:1;
    }

    .nodo{
      fill:rgba(255,255,255,.42);
      filter:drop-shadow(0 0 5px rgba(255,255,255,.15));
    }

    .poligono-base{
      fill:none;
      stroke:rgba(255,230,0,.52);
      stroke-width:1.8;
      stroke-linejoin:round;
      filter:drop-shadow(0 0 5px rgba(255,230,0,.18));
    }

    .poligono-interno{
      fill:none;
      stroke:rgba(124,255,210,.42);
      stroke-width:1.4;
      stroke-linejoin:round;
      filter:drop-shadow(0 0 5px rgba(124,255,210,.14));
    }

    .cauda{
      fill:none;
      stroke:url(#caudaGrad);
      stroke-width:4;
      stroke-linecap:round;
      stroke-linejoin:round;
      opacity:.9;
      filter:drop-shadow(0 0 10px rgba(255,230,0,.55));
    }

    .cauda-fria{
      fill:none;
      stroke:url(#caudaFriaGrad);
      stroke-width:2;
      stroke-linecap:round;
      stroke-linejoin:round;
      opacity:.62;
      filter:drop-shadow(0 0 10px rgba(127,252,255,.42));
    }

    .ponto{
      fill:var(--gold);
      filter:
        drop-shadow(0 0 7px rgba(255,230,0,1))
        drop-shadow(0 0 22px rgba(255,230,0,.75));
    }

    .halo{
      fill:rgba(255,230,0,.18);
      stroke:rgba(255,230,0,.55);
      stroke-width:.8;
      filter:drop-shadow(0 0 18px rgba(255,230,0,.65));
    }

    .frases{
      margin-top:2px;
      margin-bottom:24px;
      display:flex;
      flex-direction:column;
      gap:4px;
    }

    .frases p{
      font-family:Georgia, "Times New Roman", serif;
      font-style:italic;
      font-weight:800;
      font-size:clamp(24px, 3.1vw, 42px);
      line-height:1.13;
    }

    .btn{
      min-width:300px;
      min-height:58px;
      padding:0 30px;
      background:rgba(255,230,0,.035);
      border:1px solid var(--gold);
      color:var(--gold);
      text-transform:uppercase;
      font-size:11px;
      font-weight:900;
      letter-spacing:.28em;
      cursor:pointer;
      transition:.22s ease;
    }

    .btn:hover{
      background:var(--gold);
      color:#000;
      box-shadow:0 0 28px rgba(255,230,0,.22);
      transform:translateY(-1px);
    }

    .sussurro{
      margin-top:14px;
      font-size:10px;
      letter-spacing:.2em;
      text-transform:uppercase;
      color:rgba(255,255,255,.30);
    }

    footer{
      position:absolute;
      left:0;
      right:0;
      bottom:14px;
      width:100%;
      border-top:1px solid rgba(255,255,255,.22);
      padding-top:15px;
      display:grid;
      grid-template-columns:1fr 2fr 1fr;
      gap:18px;
      align-items:center;
    }

    footer strong{
      font-size:12px;
      letter-spacing:.24em;
      text-transform:uppercase;
    }

    footer .centro{
      text-align:center;
      color:rgba(255,255,255,.72);
      font-family:Georgia, "Times New Roman", serif;
      font-style:italic;
      font-size:12px;
      line-height:1.28;
    }

    footer .direita{
      text-align:right;
    }

    @media(max-width:720px){
      .page{
        padding-bottom:130px;
      }

      .teia{
        width:min(360px, 88vw);
        height:min(360px, 88vw);
      }

      footer{
        grid-template-columns:1fr;
        text-align:center;
      }

      footer .direita{
        text-align:center;
      }

      .btn{
        min-width:240px;
        width:100%;
        max-width:340px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="portal">
      <div class="eyebrow">Tela01 · Portal</div>

      <h1>PRISMA13</h1>

      <p class="sub">
        Arquitetura de vitalidade em evolução contínua.
      </p>

      <div class="teia">
        <svg id="teiaSvg" viewBox="-190 -190 380 380" aria-label="Teia dinâmica PRISMA13">
          <defs>
            <linearGradient id="caudaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="rgba(255,230,0,0)" />
              <stop offset="34%" stop-color="rgba(255,230,0,.18)" />
              <stop offset="72%" stop-color="rgba(255,184,0,.75)" />
              <stop offset="100%" stop-color="rgba(255,230,0,1)" />
            </linearGradient>

            <linearGradient id="caudaFriaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="rgba(127,252,255,0)" />
              <stop offset="54%" stop-color="rgba(127,252,255,.30)" />
              <stop offset="100%" stop-color="rgba(127,252,255,.88)" />
            </linearGradient>
          </defs>

          <g id="grade"></g>
          <g id="poligonos"></g>

          <path id="caudaFria" class="cauda-fria" d="" />
          <path id="cauda" class="cauda" d="" />

          <circle id="halo" class="halo" cx="0" cy="0" r="14" />
          <circle id="ponto" class="ponto" cx="0" cy="0" r="7.5" />

          <g id="labels"></g>
        </svg>
      </div>

      <div class="frases">
        <p>O Solo, fértil, sustenta a vida.</p>
        <p>A Cultura, autônoma, orienta a melhoria.</p>
      </div>

      <button class="btn" onclick="entrar()">Ingressar na PUP13</button>

      <div class="sussurro">Registro em curso</div>
    </section>

    <footer>
      <strong>SOL 1985</strong>

      <div class="centro">
        Seeemmpre melhorrrAndo... <b>NUNKAKABA!</b><br>
        Há braços! · Dr. Olair Rafael
      </div>

      <strong class="direita">ESBELTEZA IMC22</strong>
    </footer>
  </main>

  <script>
    const dimensoes = [
      "Vigor",
      "Clareza",
      "Vínculo",
      "Direção",
      "Suficiência",
      "Sentido",
      "Fruição",
      "Maestria",
      "Impacto",
      "Ecologia",
      "Laço",
      "Pertencimento",
      "Expressão"
    ];

    const valoresExternos = [82, 70, 74, 86, 64, 70, 78, 76, 58, 72, 88, 69, 81];
    const valoresInternos = [38, 44, 52, 46, 39, 56, 48, 42, 34, 66, 84, 48, 37];

    const grade = document.getElementById("grade");
    const labels = document.getElementById("labels");
    const poligonos = document.getElementById("poligonos");
    const ponto = document.getElementById("ponto");
    const halo = document.getElementById("halo");
    const cauda = document.getElementById("cauda");
    const caudaFria = document.getElementById("caudaFria");

    const centro = { x:0, y:0 };
    const raioMax = 116;
    const raioLabel = 154;
    const total = dimensoes.length;
    const trilha = [];
    const trilhaMax = 42;

    function polar(angulo, raio){
      return {
        x: Math.cos(angulo) * raio,
        y: Math.sin(angulo) * raio
      };
    }

    function anguloDimensao(i){
      return -Math.PI / 2 + (i * 2 * Math.PI / total);
    }

    function criarSVG(tag, attrs = {}){
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      Object.entries(attrs).forEach(([k,v]) => el.setAttribute(k,v));
      return el;
    }

    function pontosPoligono(valores){
      return valores.map((v,i)=>{
        const p = polar(anguloDimensao(i), raioMax * (v / 100));
        return `${p.x.toFixed(2)},${p.y.toFixed(2)}`;
      }).join(" ");
    }

    function montarTeia(){
      [28, 54, 82, 116].forEach(r=>{
        grade.appendChild(criarSVG("circle", {
          cx:0,
          cy:0,
          r,
          class:"grade"
        }));
      });

      dimensoes.forEach((nome,i)=>{
        const a = anguloDimensao(i);
        const fim = polar(a, raioMax);
        const lab = polar(a, raioLabel);

        grade.appendChild(criarSVG("line", {
          x1:0,
          y1:0,
          x2:fim.x,
          y2:fim.y,
          class:"raio"
        }));

        [28,54,82,116].forEach(r=>{
          const n = polar(a,r);
          grade.appendChild(criarSVG("circle", {
            cx:n.x,
            cy:n.y,
            r:2.8,
            class:"nodo"
          }));
        });

        const text = criarSVG("text", {
          x:lab.x,
          y:lab.y,
          class:"label"
        });
        text.textContent = nome.toUpperCase();
        labels.appendChild(text);
      });

      poligonos.appendChild(criarSVG("polygon", {
        points:pontosPoligono(valoresExternos),
        class:"poligono-base"
      }));

      poligonos.appendChild(criarSVG("polygon", {
        points:pontosPoligono(valoresInternos),
        class:"poligono-interno"
      }));
    }

    function caminhoTrilha(lista){
      if(lista.length < 2) return "";

      return lista.map((p,i)=>{
        const prefixo = i === 0 ? "M" : "L";
        return `${prefixo} ${p.x.toFixed(2)} ${p.y.toFixed(2)}`;
      }).join(" ");
    }

    function animar(){
      const agora = performance.now() / 1000;

      /*
        Movimento levógiro:
        o ângulo diminui com o tempo, fazendo o ponto girar à esquerda.
        A precessão cria uma oscilação lenta, como algoritmo que não apenas roda:
        ele vagueia, inclina, retorna e avança.
      */

      const velocidade = 0.42;
      const precessao = Math.sin(agora * 0.73) * 0.24;
      const ondulacao = Math.sin(agora * 1.17) * 10;
      const respiracao = Math.sin(agora * 2.2) * 4;

      const angulo = -Math.PI / 2 - agora * velocidade + precessao;
      const raio = 78 + ondulacao + respiracao;

      const pos = polar(angulo, raio);

      trilha.push(pos);
      if(trilha.length > trilhaMax) trilha.shift();

      ponto.setAttribute("cx", pos.x);
      ponto.setAttribute("cy", pos.y);

      halo.setAttribute("cx", pos.x);
      halo.setAttribute("cy", pos.y);
      halo.setAttribute("r", 12 + Math.sin(agora * 5) * 2.4);

      cauda.setAttribute("d", caminhoTrilha(trilha));
      caudaFria.setAttribute("d", caminhoTrilha(trilha.slice(0, -6)));

      requestAnimationFrame(animar);
    }

    function entrar(){
      window.location.href = "tela02/index.html";
    }

    montarTeia();
    animar();
  </script>
</body>
</html>
