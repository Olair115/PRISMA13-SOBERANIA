<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>PRISMAS — a imPRECISÃO da Vida.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600;1,700&family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --ouro: #ffd700;
      --ouro-vivo: #fff2a8;
      --cyan: #7ffcff;
      --borda: rgba(255, 215, 0, 0.2);
      --portal-base: #000000;
      --portal-centro: rgba(10, 25, 50, 0.3);
      --portal-anel: rgba(127, 252, 255, 0.2);
      --portal-luz: rgba(255, 215, 0, 0.18);
      --portal-acento: #7ffcff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: "Montserrat", sans-serif; background-color: var(--portal-base); transition: background-color 520ms ease; }
    body, h1, p, div, span, label, input, button, footer, header, section, main, text { color: var(--ouro) !important; }
    
    #kosmos { position: fixed; inset: 0; z-index: -2; background: radial-gradient(circle at center, var(--portal-centro) 0%, var(--portal-base) 100%); transition: background 520ms ease; }
    #kosmos::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(1.5px 1.5px at 20px 30px, #fff, rgba(0,0,0,0)), 
                  radial-gradient(2px 2px at 70px 90px, #fff, rgba(0,0,0,0)),
                  radial-gradient(1px 1px at 140px 130px, #fff, rgba(0,0,0,0));
      background-size: 180px 180px; opacity: 0.65;
    }
    .shooting-star {
      position: absolute; top: 10%; left: 30%; width: 80px; height: 1px;
      background: linear-gradient(90deg, #ffffff, transparent); transform: rotate(-25deg); opacity: 0; animation: shoot 6s infinite ease-in-out;
    }
    .star-2 { top: 25%; left: 65%; width: 120px; animation-delay: 2s; animation-duration: 8s; }
    .star-3 { top: 5%; left: 80%; width: 60px; animation-delay: 4.5s; animation-duration: 5s; }
    @keyframes shoot { 0% { opacity: 0; transform: translate(0,0) rotate(-25deg); } 5% { opacity: 0.8; } 15% { opacity: 0; transform: translate(-150px, 70px) rotate(-25deg); } 100% { opacity: 0; } }

    .framework-tela { position: relative; z-index: 2; width: 100%; height: 100vh; display: grid; grid-template-rows: auto 1fr auto; align-items: center; justify-items: center; padding: 20px 40px; }
    
    .framework-header { width: 100%; max-width: 1200px; display: flex; flex-direction: column; align-items: center; gap: 6px; border-bottom: 1px solid var(--borda); padding-bottom: 14px; text-align: center; }
    .framework-header .brand { font-weight: 900; font-size: 1.8rem; letter-spacing: 5px; text-transform: uppercase; text-shadow: 0 0 8px var(--ouro); }
    .framework-header .sub-brand { font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 1.1rem; color: var(--ouro-vivo) !important; opacity: 0.85; margin-bottom: 2px; }
    .framework-header .meta-display { display: flex; gap: 16px; align-items: center; font-family: monospace; font-size: 0.85rem; color: var(--cyan) !important; }
    
    .centro-mandala { width: 100%; height: 100%; display: grid; place-items: center; }
    .mandala-wrap { width: min(650px, 65vmin); aspect-ratio: 1 / 1; display: grid; place-items: center; }
    .cauda { fill: none; stroke: url(#caudaGrad); stroke-width: 4.5; stroke-linecap: round; filter: drop-shadow(0 0 10px var(--portal-anel)); transition: filter 420ms ease; }
    .cauda-fria { fill: none; stroke: url(#caudaFriaGrad); stroke-width: 2.5; stroke-linecap: round; opacity: 0.35; }
    .ponto { fill: var(--portal-acento); filter: drop-shadow(0 0 10px var(--portal-acento)); transition: fill 420ms ease, filter 420ms ease; }
    .halo { fill: rgba(127, 252, 255, 0.06); stroke: var(--portal-anel); stroke-width: 1; transition: stroke 420ms ease; }
    
    .base-controle { width: 100%; max-width: 1200px; display: grid; gap: 16px; justify-items: center; }
    .entrada-unificada { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 280px; }
    .degustacao-cromatica {
      width: min(440px, 86vw);
      display: grid;
      gap: 9px;
      justify-items: center;
      padding: 10px 14px 12px;
      border: 1px solid rgba(127, 252, 255, 0.22);
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(127, 252, 255, 0.08), var(--portal-luz));
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28), inset 0 0 18px rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(4px);
      transition: background 420ms ease, border-color 420ms ease, box-shadow 420ms ease;
    }
    .degustacao-cromatica__rotulo {
      color: var(--ouro-vivo) !important;
      font-size: 0.62rem;
      font-weight: 900;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }
    .controle-cromatico {
      width: 100%;
      height: 28px;
      accent-color: var(--portal-acento);
      cursor: pointer;
    }
    .controle-cromatico::-webkit-slider-runnable-track {
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(127,252,255,0.28), rgba(255,215,0,0.72), rgba(255,86,118,0.88));
      box-shadow: inset 0 0 8px rgba(0,0,0,0.45);
    }
    .controle-cromatico::-webkit-slider-thumb {
      width: 24px;
      height: 24px;
      margin-top: -8px;
      border: 2px solid rgba(255,255,255,0.92);
      border-radius: 50%;
      background: var(--portal-acento);
      box-shadow: 0 0 14px var(--portal-acento), 0 4px 10px rgba(0,0,0,0.35);
      appearance: none;
    }
    .controle-cromatico::-moz-range-track {
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(127,252,255,0.28), rgba(255,215,0,0.72), rgba(255,86,118,0.88));
      box-shadow: inset 0 0 8px rgba(0,0,0,0.45);
    }
    .controle-cromatico::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border: 2px solid rgba(255,255,255,0.92);
      border-radius: 50%;
      background: var(--portal-acento);
      box-shadow: 0 0 14px var(--portal-acento), 0 4px 10px rgba(0,0,0,0.35);
    }
    .campo-identificacao { display: grid; gap: 4px; text-align: center; width: 100%; }
    .campo-identificacao input { width: 100%; background: transparent; border: 0; border-bottom: 1px solid rgba(255, 215, 0, 0.6); color: var(--ouro-vivo) !important; text-align: center; font-size: 0.95rem; font-weight: 700; padding: 4px; outline: none; }
    .memoria-visita {
      min-height: 34px;
      display: grid;
      gap: 3px;
      justify-items: center;
      text-align: center;
      opacity: 0.82;
    }
    .memoria-visita__rotulo {
      color: rgba(255, 215, 0, 0.72) !important;
      font-family: "Montserrat", sans-serif;
      font-size: 0.62rem;
      font-weight: 900;
      letter-spacing: 1.1px;
      line-height: 1;
      text-transform: uppercase;
    }
    .memoria-visita__data {
      color: var(--ouro-vivo) !important;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(1rem, 1.6vw, 1.22rem);
      font-style: italic;
      font-weight: 700;
      line-height: 1.12;
      white-space: nowrap;
    }
    .btn-avancar { background: transparent; border: 1px solid var(--ouro); padding: 8px 24px; font-family: "Montserrat", sans-serif; font-size: 0.72rem; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer; border-radius: 4px; transition: all 300ms ease; }
    .btn-avancar:hover { background: var(--portal-luz); box-shadow: 0 0 14px var(--portal-anel); }
    
    /* ENGENHARIA DE ARQUITETURA: RODAPÉ PADRÃO UNIVERSAL JUSTAPOSTO */
    .framework-footer { width: 100%; max-width: 1200px; display: grid; grid-template-columns: auto minmax(220px, max-content) auto; justify-content: center; align-items: center; gap: 16px; border-top: 1px solid var(--borda); padding-top: 16px; }
    .selo-container { display: flex; align-items: center; gap: 12px; font-weight: 900; font-size: 0.75rem; letter-spacing: 1.5px; }
    .selo-container.esquerda { justify-content: flex-end; }
    .selo-container.direita { justify-content: flex-start; }
    .selo-colorido-sol { width: 26px; height: 26px; border-radius: 50%; background: conic-gradient(#ff4500, #ffa500, #ffd700, #adff2f, #00ffff, #ff4500); box-shadow: 0 0 8px rgba(255, 165, 0, 0.5); }
    .selo-colorido-imc { width: 24px; height: 24px; border-radius: 4px; background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); box-shadow: 0 0 8px rgba(79, 172, 254, 0.5); }
    .footer-slogan { text-align: center; font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 700; font-size: clamp(1.2rem, 1.45vw, 1.55rem); line-height: 1.4; display: flex; flex-direction: column; gap: 2px; }
    @media (max-width: 820px) { .framework-footer { grid-template-columns: 1fr; gap: 12px; text-align: center; } .selo-container.esquerda, .selo-container.direita { justify-content: center; } }
  </style>
</head>
<body>
  <div id="kosmos" aria-hidden="true"><div class="shooting-star"></div><div class="shooting-star star-2"></div><div class="shooting-star star-3"></div></div>
  <main class="framework-tela">
    <header class="framework-header">
      <div class="brand">PRISMAS</div>
      <div class="sub-brand">a imPRECISÃO da Vida.</div>
      <div class="meta-display"><span id="relogioDisplay">--/--/---- --:--:-- (UTC-3)</span></div>
    </header>
    <section class="centro-mandala">
      <div class="mandala-wrap">
        <svg id="teiaSvg" class="mandala-svg" viewBox="0 0 760 760">
          <defs>
            <linearGradient id="caudaGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="rgba(127,252,255,0)" /><stop offset="60%" stop-color="rgba(127,252,255,0.4)" /><stop offset="100%" stop-color="rgba(127,252,255,1)" /></linearGradient>
            <linearGradient id="caudaFriaGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="rgba(255,255,255,0)" /><stop offset="100%" stop-color="rgba(255,255,255,0.25)" /></linearGradient>
          </defs>
          <g id="gridMandala"></g>
          <path id="tailMandala" class="cauda" d="" /><path id="caudaFria" class="cauda-fria" d="" />
          <circle id="halo" class="halo" cx="380" cy="380" r="18" /><circle id="ponto" class="ponto" cx="380" cy="380" r="6.5" /><circle class="nucleo" cx="380" cy="380" r="6" />
        </svg>
      </div>
    </section>
    <section class="base-controle">
      <div class="degustacao-cromatica" aria-label="Degustação cromática PRISMAS">
        <span class="degustacao-cromatica__rotulo">Vigor cromático</span>
        <input id="controleCromatico" class="controle-cromatico" type="range" min="0" max="100" value="38" aria-label="Vigor cromático do portal" />
      </div>
      <div class="entrada-unificada">
        <div class="campo-identificacao"><input id="login" type="text" placeholder="informar identificação" autofocus /></div>
        <div id="ultimaVisita" class="memoria-visita"></div>
        <button id="btnConvidar" class="btn-avancar" type="button">Avançar para o Portal</button>
      </div>
      <footer class="framework-footer">
        <div class="selo-container esquerda"><div class="selo-colorido-sol"></div><div>SOL 1985</div></div>
        <div class="footer-slogan">
          <div>O solo fértil garante a sobrevivência.</div><div>A cultura autônoma garante a melhoria.</div>
          <div>Seeemmpre melhorrrAndo... NUNKAKABA!</div><div>Há braços! | Dr. Olair Rafael – @drolairrafael</div>
        </div>
        <div class="selo-container direita"><div>ESBELTEZA imc22</div><div class="selo-colorido-imc"></div></div>
      </footer>
    </section>
  </main>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
        function atualizarRelogio() {
            const agora = new Date(); const utc = agora.getTime() + (agora.getTimezoneOffset() * 60000); const dataSaoPaulo = new Date(utc + (3600000 * -3));
            const dia = String(dataSaoPaulo.getDate()).padStart(2, '0'); const mes = String(dataSaoPaulo.getMonth() + 1).padStart(2, '0'); const ano = dataSaoPaulo.getFullYear();
            const hora = String(dataSaoPaulo.getHours()).padStart(2, '0'); const min = String(dataSaoPaulo.getMinutes()).padStart(2, '0'); const seg = String(dataSaoPaulo.getSeconds()).padStart(2, '0');
            document.getElementById("relogioDisplay").textContent = `${dia}/${mes}/${ano} ${hora}:${min}:${seg} (UTC-3)`;
        }
        setInterval(atualizarRelogio, 1000); atualizarRelogio();
        const memoriaContainer = document.getElementById("ultimaVisita"); const cadastroSessao = localStorage.getItem("prismas.sessao");
        if(cadastroSessao) { try { const dados = JSON.parse(cadastroSessao); memoriaContainer.innerHTML = `<span class="memoria-visita__rotulo">Ultima visita</span><span class="memoria-visita__data">${dados.dataFormatada}</span>`; } catch(e) {} }
        const svg = document.getElementById("teiaSvg"), gridG = document.getElementById("gridMandala"), caudaPath = document.getElementById("tailMandala"), caudaFriaPath = document.getElementById("caudaFria"), ponto = document.getElementById("ponto"), halo = document.getElementById("halo"), loginInput = document.getElementById("login"), btnConvidar = document.getElementById("btnConvidar"), controleCromatico = document.getElementById("controleCromatico");
        const CONFIG = { intervaloPulsoMs: 333, totalDimensoes: 13, totalEstagios: 5 };
        const MANDALA = { cx: 380, cy: 380, raiosBase: [82, 126, 172, 220, 270], dimAtual: 0, estagioAtual: 2, ciclo: 0, passo: 0, coords: [], maxHist: 9, historico: [] };
        const DIMENSOES = ["Soberania", "Ar Limpo", "Água Viva", "Luz Solar", "Sono", "Movimento", "Nutrição", "Jejum", "Pensamento", "Sentimento", "Zenim", "Ações", "Trabalho"];
        function criarSVG(t,a={}){const e=document.createElementNS("http://www.w3.org/2000/svg",t);Object.entries(a).forEach(([t,a])=>e.setAttribute(t,a));return e}
        function polar(t,a){const e=a*Math.PI/180;return{x:MANDALA.cx+Math.cos(e)*t,y:MANDALA.cy+Math.sin(e)*t}}
        function raioIrregular(t,a){return MANDALA.raiosBase[a]+Math.sin((t+1)*.88+a*.96+MANDALA.ciclo*.42)*14}
        function desenharGradeEstatica(){
            if(!gridG)return;gridG.innerHTML=""; MANDALA.raiosBase.forEach(t=>{gridG.appendChild(criarSVG("circle",{cx:MANDALA.cx,cy:MANDALA.cy,r:t,style:"fill:none;stroke:rgba(255,215,0,0.12);stroke-width:1;"}))});
            const t=360/CONFIG.totalDimensoes; DIMENSOES.forEach((a,e)=>{
                const r=-90+e*t,n=polar(285,r); gridG.appendChild(criarSVG("line",{x1:MANDALA.cx,y1:MANDALA.cy,x2:n.x,y2:n.y,style:"stroke:rgba(255,215,0,0.2);stroke-width:1;"}));
                const s=polar(315,r),o=criarSVG("text",{x:s.x,y:s.y,"text-anchor":"middle","dominant-baseline":"middle",style:"fill:#ffd700;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:800;letter-spacing:0.5px;"});
                o.textContent=a.toUpperCase();gridG.appendChild(o);
            });
        }
        function ajustarVigorCromatico(valor){
            const vigor = Math.max(0, Math.min(100, Number(valor))) / 100;
            const hue = Math.round(184 + vigor * 150);
            const centroAlpha = (0.22 + vigor * 0.42).toFixed(2);
            const luzAlpha = (0.10 + vigor * 0.28).toFixed(2);
            const anelAlpha = (0.22 + vigor * 0.42).toFixed(2);
            document.documentElement.style.setProperty("--portal-base", `hsl(${Math.round(198 + vigor * 32)} 28% ${Math.round(4 + vigor * 7)}%)`);
            document.documentElement.style.setProperty("--portal-centro", `hsla(${hue} 90% ${Math.round(18 + vigor * 22)}% / ${centroAlpha})`);
            document.documentElement.style.setProperty("--portal-anel", `hsla(${hue} 96% ${Math.round(68 + vigor * 14)}% / ${anelAlpha})`);
            document.documentElement.style.setProperty("--portal-luz", `hsla(${Math.round(48 - vigor * 24)} 100% ${Math.round(54 + vigor * 8)}% / ${luzAlpha})`);
            document.documentElement.style.setProperty("--portal-acento", `hsl(${hue} 96% ${Math.round(68 + vigor * 14)}%)`);
        }
        if(controleCromatico){
            ajustarVigorCromatico(controleCromatico.value);
            controleCromatico.addEventListener("input", e => ajustarVigorCromatico(e.target.value));
        }
        function atualizarGeometriaTeia(){MANDALA.coords=[];const t=360/CONFIG.totalDimensoes;for(let a=0;a<CONFIG.totalDimensoes;a++){MANDALA.coords[a]=[];const e=-90+a*t;for(let r=0;r<CONFIG.totalEstagios;r++)MANDALA.coords[a][r]=polar(raioIrregular(a,r),e)}}
        desenharGradeEstatica();
        setInterval(() => {
            MANDALA.ciclo+=.24;MANDALA.passo+=1;atualizarGeometriaTeia(); MANDALA.dimAtual=(MANDALA.dimAtual-1+CONFIG.totalDimensoes)%CONFIG.totalDimensoes; MANDALA.estagioAtual=Math.floor(Math.random()*CONFIG.totalEstagios);
            const t=MANDALA.coords[MANDALA.dimAtual][MANDALA.estagioAtual];MANDALA.historico.push({x:t.x,y:t.y}); if(MANDALA.historico.length>MANDALA.maxHist)MANDALA.historico.shift();
            if(MANDALA.historico.length>1){let t=`M ${MANDALA.historico[0].x} ${MANDALA.historico[0].y}`;for(let a=1;a<MANDALA.historico.length;a++)t+=` L ${MANDALA.historico[a].x} ${MANDALA.historico[a].y}`;if(caudaPath)caudaPath.setAttribute("d",t);if(caudaFriaPath)caudaFriaPath.setAttribute("d",t)}
            if(ponto&&halo){ponto.setAttribute("cx",t.x);ponto.setAttribute("cy",t.y);halo.setAttribute("cx",t.x);halo.setAttribute("cy",t.y);halo.setAttribute("r",14+4*Math.sin(.5*MANDALA.passo))}
        }, CONFIG.intervaloPulsoMs);
        function ejecutarAvanco(){const t=loginInput.value.trim();if(t.length>0){const ag = new Date();const dataStr = ag.toLocaleDateString('pt-BR') + ' às ' + ag.toLocaleTimeString('pt-BR');localStorage.setItem("prismas.sessao",JSON.stringify({sistema:"PRISMAS",usuario:t,dataFormatada:dataStr}));window.location.href="tela02/index.html"}else loginInput.focus()}
        btnConvidar.addEventListener("click",ejecutarAvanco);loginInput.addEventListener("keydown",t=>{"Enter"===t.key&&executarAvanco()});
    });
  </script>
  <script src="scripts/footer-selos.js"></script>
</body>
</html>
