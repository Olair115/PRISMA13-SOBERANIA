<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRISMA13 - Escolhas</title>
    <style>
        :root { --primary: #6c5ce7; --bg: #000; --gold: #ffd700; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; text-align: center; }
        .container { max-width: 600px; width: 100%; }
        h2 { font-size: 2.2rem; letter-spacing: 6px; text-transform: uppercase; margin-bottom: 40px; font-weight: 800; }
        .lista-escolhas { text-align: left; list-style: none; padding: 0; margin-bottom: 50px; }
        .lista-escolhas li { padding: 15px 0; border-bottom: 1px solid #111; color: var(--gold); font-size: 1.1rem; font-weight: 600; }
        .lista-escolhas li::before { content: "✓ "; color: var(--primary); font-weight: 900; }
        .btn-evolucao { background: transparent; color: var(--gold); border: none; padding: 25px; cursor: pointer; width: 100%; font-family: 'Times New Roman', Times, serif; font-size: 1.7rem; font-weight: bold; transition: 0.4s; }
        .footer-padrao { margin-top: 60px; padding-top: 30px; border-top: 1px solid #222; }
        .lema { font-size: 0.9rem; letter-spacing: 1.5px; color: #888; }
        .lema i { font-style: italic; color: #bbb; }
        .lema b { font-weight: 900; color: var(--primary); text-transform: uppercase; }
        .saudacao { display: block; margin-top: 10px; font-weight: 700; color: #fff; font-size: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <h2>COFATORES DE VIGOR</h2>
        <ul class="lista-escolhas">
            <li>Mente serena e disposição matinal constante</li>
            <li>Imunidade robusta (ausência de inflamações)</li>
            <li>Resiliência a estressores ambientais e toxinas</li>
        </ul>
        <button class="btn-evolucao" onclick="window.location.href='/tela05/index.html'">Iniciar a r)Evolução</button>
        <footer class="footer-padrao">
            <p class="lema"><i>Seeemmpre MelhorrrAndo...</i> <b>NUNKAKABA!</b><span class="saudacao">Há braços!</span></p>
        </footer>
    </div>
</body>
</html>
