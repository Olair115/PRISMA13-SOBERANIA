<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRISMA13 - Vigor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --primary: #6c5ce7; --bg: #0a0f1d; --card: #111; --gold: #ffd700; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card-prisma13 { background: var(--card); max-width: 450px; width: 92%; padding: 30px; border-radius: 25px; border: 1px solid #333; text-align: center; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 12px; border: 1px solid #444; background: #222; color: #fff; text-align: center; }
        label { display: block; text-align: left; margin-top: 10px; color: var(--primary); font-size: 0.7rem; font-weight: bold; text-transform: uppercase; }
        .btn-vigor { background: var(--primary); transition: 0.3s; }
        .btn-vigor:hover { background: #5849be; transform: scale(1.02); }
    </style>
</head>
<body>
    <div class="card-prisma13">
        <h1 class="text-3xl font-black tracking-widest text-white uppercase">VIGOR</h1>
        <p class="text-xs text-gray-500 mt-1">Conatus: Poder de Perseverar</p>

        <div class="mt-8 space-y-2">
            <label>Peso Atual (kg):</label>
            <input type="number" id="peso" step="0.1" placeholder="Ex: 82.4">
            
            <label>Altura Atual (m):</label>
            <input type="number" id="altura" step="0.01" placeholder="Ex: 1.75">
            
            <label>CEP de Atuação:</label>
            <input type="text" id="cep_vigor" placeholder="12327-190">
        </div>

        <button onclick="calibrarVigorSoberano()" class="btn-vigor mt-10 w-full text-white font-bold py-4 rounded-xl text-lg shadow-lg uppercase">
            CALIBRAR VIGOR VITAL
        </button>

        <p class="mt-6 text-[10px] text-gray-600 uppercase font-bold">
            Seeemmpre MelhorrrAndo... NUNKAKABA!
        </p>
    </div>

    <script>
        function calibrarVigorSoberano() {
            const p = document.getElementById('peso').value;
            const h = document.getElementById('altura').value;
            const c = document.getElementById('cep_vigor').value;

            if (!p || !h) {
                alert("Zelar pela harmonia dos dados de Peso e Altura.");
                return;
            }

            // Fixar no Lastro Digital
            localStorage.setItem('prisma_p', p);
            localStorage.setItem('prisma_h', h);
            localStorage.setItem('p_cep', c);

            // ENGATE PARA A TELA 03 (VEREDITO)
            window.location.href = "../TELA 03 - VEREDITO/index.html";
        }

        // Recuperar CEP se já existir
        window.onload = () => {
            if(localStorage.getItem('p_cep')) document.getElementById('cep_vigor').value = localStorage.getItem('p_cep');
        };
    </script>
</body>
</html>
